<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homy</title>
  <script>
    // Anti-flash theme bootstrap — MUST run before the CSS loads. Applies the
    // mirrored theme (localStorage 'homy-theme') as a data-theme attribute so
    // the [data-theme] CSS fallbacks paint the right palette immediately,
    // including on the login view before any auth. The server settings remain
    // the source of truth and refresh this mirror once authenticated.
    (function () {
      var t = 'dark';
      try {
        var stored = localStorage.getItem('homy-theme');
        if (stored === 'light' || stored === 'dark') t = stored;
      } catch (e) {
        /* storage unavailable — keep default */
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/vendor/gridstack/gridstack.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ===== Login / Setup view ===== -->
    <section id="login-view" class="view hidden">
      <div class="auth-card">
        <h1 class="brand">Homy</h1>

        <form id="login-form" class="auth-form">
          <h2>Sign in</h2>
          <label>
            <span>Username</span>
            <input type="text" name="user" autocomplete="username" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="form-error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <form id="setup-form" class="auth-form hidden">
          <h2>First-run setup</h2>
          <p class="muted">Create the admin account for this instance.</p>
          <label>
            <span>Username</span>
            <input type="text" name="user" autocomplete="username" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="new-password" minlength="6" required />
          </label>
          <label>
            <span>Confirm password</span>
            <input type="password" name="confirm" autocomplete="new-password" minlength="6" required />
          </label>
          <p id="setup-error" class="form-error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Create account</button>
        </form>
      </div>
    </section>

    <!-- ===== Dashboard view ===== -->
    <section id="dashboard-view" class="view hidden">
      <!-- Topbar: a compact 2-row flex column. Row 1 is the live bar
           (brand + actions); row 2 (#topbar-tabs) is the reserved slot for
           the future pages/tabs nav (separate chantier) — empty today, so the
           bar can grow without restructuring. In VIEW mode the whole header is
           hidden by default and a right-click toggles it (main.js
           applyTopbarState): it is pulled above the viewport by its MEASURED
           height so #dashboard-body reclaims exactly that space. In EDIT mode
           it stays visible permanently. -->
      <header class="topbar">
        <div class="topbar-row">
          <!-- GROUP 1 — brand (anchored left, STATIC: no motion). -->
          <h1 class="brand">Homy</h1>
          <!-- GROUP 3 — edit-only admin actions (Background / Theme). A SIBLING
               of the cluster (not a child) so it can descend from the top
               independently in the validated 2-beat topbar choreography. It is
               absolutely positioned to the LEFT of the cluster in EDIT mode
               (right: --cluster-w + gap) and parked above the bar in VIEW
               (opacity 0 / translateY). Visibility is a CSS state (mode-view /
               mode-edit, see style.css) — NOT .hidden, which would kill the
               transition. main.js keeps it inert outside edit mode. -->
          <div id="editor-actions" class="editor-actions">
            <button id="elements-btn" class="btn" type="button">Elements</button>
            <button id="bg-btn" class="btn" type="button">Background</button>
            <button id="theme-btn" class="btn" type="button">Theme: Dark</button>
          </div>
          <!-- GROUP 2 — user / Edit / Logout (slides RIGHT on ENTER). -->
          <div class="topbar-actions">
            <span id="user-label" class="muted"></span>
            <button id="toggle-mode" class="btn">Edit</button>
            <button id="logout-btn" class="btn btn-ghost">Logout</button>
          </div>
        </div>
        <!-- Pages/tabs row (multiple pages, lot C+D): filled by public/js/
             ui/tabs.js (renderTabs). Visibility is decided there: always
             visible in EDIT mode (the only way to create the 2nd page),
             visible in VIEW mode only when there are ≥ 2 pages — the whole
             topbar then follows the right-click toggle. -->
        <nav id="topbar-tabs" class="topbar-tabs hidden" aria-label="Dashboard pages"></nav>
      </header>

      <div id="dashboard-body" class="dashboard-body">
        <div id="editor-palette" class="palette hidden">
          <h3>Add widget</h3>
          <div id="palette-list" class="palette-list"></div>
        </div>

        <main id="grid-wrap" class="grid-wrap">
          <!-- Framed dezoomed preview (edit mode only): the wrapper is a
               no-op in view mode (display:contents) and becomes the 16:9
               frame in edit mode. #grid-preview-bg is only an ANCHOR the
               background manager measures in edit mode: the themed layers
               stay on <body> and are clipped to this rect via clip-path
               (lot 2, reworked — no re-parenting, no crop/backing re-flow). -->
          <div id="grid-preview" class="grid-preview">
            <div id="grid-preview-bg"></div>
            <div id="grid-container" class="grid-stack"></div>
          </div>
        </main>
      </div>
    </section>

  </div>

  <script src="/vendor/gridstack/gridstack.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
