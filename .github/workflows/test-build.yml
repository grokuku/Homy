# =============================================================================
# Homy — CI "image" workflow: validation, ONE multi-arch image build,
# per-platform container smoke test, and publication of the TEST image
# (`:test`) on ghcr.io.
#
# Same working principle as Yuki (`.github/workflows/test-build.yml`), adapted
# to a Node app with no front-end build step and no native module:
#
#   quality → npm ci + `npm run check:schema` + version.txt validation ;
#   image   → ONE multi-arch build (`linux/amd64` + `linux/arm64`, QEMU),
#             pushed as `:sha-<short>`, then the manifest guard
#             (`scripts/assert-image-platforms.sh`) and a smoke test of BOTH
#             platforms (`GET /api/health` + embedded version) ;
#   publish → promotes that very manifest list to `:test` (no rebuild), then
#             re-asserts the platforms of the published tag.
#
# WHY the test build is multi-arch (regression fixed here):
#   The test image used to be `docker build --platform linux/amd64`, i.e. a
#   SINGLE-platform image. Running it on an arm64 host (Raspberry Pi, ARM NAS,
#   Apple Silicon) produced an endless restart loop:
#
#       exec /usr/local/bin/docker-entrypoint.sh: exec format error
#
#   `docker build` succeeded on the amd64 runner, so CI stayed green while the
#   container could not start on arm64. Test and release now publish the SAME
#   platform set, and the guard fails the run if a platform ever goes missing
#   again (fail fast instead of a container that restarts forever).
#
# Why the image is built exactly once: a multi-platform image cannot be
# `docker load`ed, so the build is pushed to the immutable `:sha-<short>` tag
# first, smoke-tested there, and only then promoted to the floating `:test`
# tag with `docker buildx imagetools create` (a registry-side copy of the
# manifest list: no rebuild, no re-push of layers, same digests). The image
# behind `:test` is therefore always one that booted successfully.
#
# Tag policy — do not blur the two workflows:
#   * this file owns `:test` (throwaway) and `:sha-<short>` (immutable);
#   * `release.yml` owns `:<version>` and `:latest`.
#   A test build can therefore NEVER overwrite a published release.
#
# No secret to configure: the ephemeral `GITHUB_TOKEN` is enough. The
# repository must however allow package writes (`packages: write`), see the
# README "CI/CD" section.
# =============================================================================
name: Test build (ghcr :test)

on:
  # Automatic test build on every push to the default branch...
  push:
    branches: [main]
  # ...and on pull requests targeting it. Publication is gated below: a PR
  # only validates (quality + build + smoke test), it never pushes an image.
  pull_request:
    branches: [main]
  # Manual replay gate: (re)build and publish `:test` on demand.
  workflow_dispatch:
  # No `tag` trigger: that is the exclusive job of `release.yml`.

# Minimal permissions:
#   contents: read   — checkout only (this workflow NEVER writes to the repo);
#   packages: write  — push of `:test` / `:sha-<short>` to ghcr.io.
permissions:
  contents: read
  packages: write

# Cancel obsolete runs for PRs only. On `push` to main and on
# `workflow_dispatch` runs are QUEUED (never killed mid-`docker push`, which
# would leave a partially published image).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # `github.repository` is "grokuku/Homy"; it is lowercased when the image
  # reference is built (ghcr only accepts lowercase). Never hardcode the image
  # name: it follows the repository.
  IMAGE_REPOSITORY: ${{ github.repository }}
  NODE_VERSION: '24'
  # THE platform set published by this workflow. It MUST match `release.yml`
  # (same two architectures): a host that can run a release must also be able
  # to run `:test`. Kept as a single env value so the build and the guard
  # below can never disagree.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: `image` and `publish` depend on it.
  # ---------------------------------------------------------------------------
  quality:
    name: Schema sync & version validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Widget settingsSchema / defaultSize must agree between the server
      # manifest and the front-end registry (no build step exists, so the data
      # is duplicated: this check is the guard against drift).
      - name: Check widget settingsSchemas (server ↔ front)
        run: npm run check:schema

      # Fail BEFORE building an image if `version.txt` is missing, empty or
      # malformed (single source of truth for the release version).
      - name: Validate version.txt
        run: node scripts/version.mjs validate

  # ---------------------------------------------------------------------------
  # Build (multi-arch) + platform guard + smoke test of EVERY platform.
  #
  # * push / workflow_dispatch: `docker/build-push-action` builds and pushes
  #   the manifest list to `:sha-<short>`; the smoke test then runs the
  #   PUBLISHED image, one platform at a time (`docker run --platform ...`).
  #   arm64 is executed under QEMU, which is exactly the code path the arm64
  #   user runs natively — if the arm64 image were broken, this job fails.
  # * pull_request: a single `linux/amd64` image is built and `load`ed locally
  #   (nothing is ever published from a PR), then smoke-tested the same way.
  #
  # QEMU is only set up when a cross-build or an emulated run is needed.
  # ---------------------------------------------------------------------------
  image:
    name: Build & smoke test (every published platform)
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      ref: ${{ steps.meta.outputs.ref }}
      platforms: ${{ steps.meta.outputs.platforms }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta
        env:
          # Context passed through `env` (never interpolated into the script):
          # avoids shell injection and centralises derivation.
          REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          REGISTRY: ${{ env.REGISTRY }}
          EVENT_NAME: ${{ github.event_name }}
          ALL_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          set -euo pipefail
          VERSION="$(node scripts/version.mjs show)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          if ! printf '%s' "${SHA_SHORT}" | grep -Eq '^[0-9a-f]+$'; then
            echo "::error::invalid short sha: '${SHA_SHORT}'"
            exit 1
          fi
          if [ -z "${REPOSITORY:-}" ]; then
            echo "::error::github.repository is empty — cannot derive the image name"
            exit 1
          fi

          IMAGE="${REGISTRY}/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # Local-only tag: the PR image is never pushed, and a PR runner
            # cannot run an emulated arm64 container reliably: amd64 only.
            REF="homy-ci:pr-${SHA_SHORT}"
            PLATFORMS="linux/amd64"
          else
            PLATFORMS="${ALL_PLATFORMS}"
            # Immutable, per-commit tag. It is pushed BEFORE the smoke test
            # (a multi-platform image cannot be loaded locally); see the
            # header comment.
            REF="${IMAGE}:sha-${SHA_SHORT}"
          fi

          {
            echo "version=${VERSION}"
            echo "sha_short=${SHA_SHORT}"
            echo "image=${IMAGE}"
            echo "ref=${REF}"
            echo "platforms=${PLATFORMS}"
          } >> "${GITHUB_OUTPUT}"
          echo "Version  : ${VERSION} (sha-${SHA_SHORT})"
          echo "Image    : ${REF}"
          echo "Platforms: ${PLATFORMS}"

      - name: Set up QEMU (arm64 cross-build + emulated run)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE build, in a single step: the manifest list pushed here is the one
      # smoke-tested below and promoted to `:test` by `publish`.
      - name: Build the image (multi-arch on push / amd64-only on PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Resolved in the metadata step: PR → `linux/amd64` (local only),
          # push/dispatch → `linux/amd64,linux/arm64`.
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.ref }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha_short }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          # GitHub Actions cache is not writable from fork PRs: only export on
          # push/dispatch (the release workflow reads the same cache).
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      # Fail fast if the registry does not expose BOTH architectures. This is
      # the guard that turns the original bug (amd64-only `:test`, container
      # stuck in `exec format error`) into an explicit CI error.
      - name: Guard the published manifest (both platforms)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.meta.outputs.ref }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s' "${PLATFORMS}" | tr ',' ' ')"
          # shellcheck disable=SC2086 # word splitting on the platform list is intended
          sh scripts/assert-image-platforms.sh "${REF}" ${EXPECTED}

      # Smoke test EVERY published platform. On an amd64 runner the amd64 leg
      # is native and the arm64 leg runs under QEMU (so the arm64 image is
      # proven to boot, not merely present in the manifest).
      - name: Smoke test the container (each platform)
        env:
          REF: ${{ steps.meta.outputs.ref }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          # `true` on push/dispatch: the image lives in the registry and must
          # be pulled. `false` on PR: it is already loaded locally.
          PUSHED: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail

          if [ -z "${REF:-}" ]; then
            echo "::error::empty image reference — metadata step failed"
            exit 1
          fi

          CLEANUP=""
          # Never leave a container (or a busy port) behind on failure.
          # shellcheck disable=SC2329 # invoked through the EXIT trap
          cleanup() {
            # shellcheck disable=SC2086 # intentional word splitting
            for name in ${CLEANUP}; do
              docker rm -f "${name}" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          INDEX=0
          for PLATFORM in $(printf '%s' "${PLATFORMS}" | tr ',' ' '); do
            INDEX=$((INDEX + 1))
            SAFE_PLATFORM="$(printf '%s' "${PLATFORM}" | tr '/' '-')"
            NAME="homy-smoke-${SAFE_PLATFORM}-${GITHUB_RUN_ID}"
            PORT=$((18080 + INDEX))
            CLEANUP="${CLEANUP} ${NAME}"

            if [ "${PLATFORM}" = "linux/arm64" ]; then
              EXPECTED_MACHINE="aarch64"
            else
              EXPECTED_MACHINE="x86_64"
            fi

            echo "::group::Smoke test ${PLATFORM}"

            # A multi-platform manifest list only yields a runnable image once
            # a platform is selected explicitly.
            if [ "${PUSHED}" = "true" ]; then
              docker pull --platform "${PLATFORM}" "${REF}"
            fi

            # Proof that this variant really is the requested architecture —
            # and, for arm64 on an amd64 runner, that QEMU is in place. This is
            # the direct check for the original `exec format error` class.
            MACHINE="$(docker run --rm --platform "${PLATFORM}" --entrypoint uname "${REF}" -m)"
            if [ "${MACHINE}" != "${EXPECTED_MACHINE}" ]; then
              echo "::error::${PLATFORM}: container reports '${MACHINE}', expected '${EXPECTED_MACHINE}'"
              exit 1
            fi
            echo "Container architecture: ${MACHINE} (${PLATFORM})"

            docker run -d --name "${NAME}" --platform "${PLATFORM}" \
              -p "${PORT}:3000" "${REF}" >/dev/null

            healthy=0
            for _ in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:${PORT}/api/health" >/dev/null 2>&1; then
                healthy=1
                break
              fi
              # Do not wait 3 minutes on a container that already crashed.
              if ! docker inspect -f '{{.State.Running}}' "${NAME}" 2>/dev/null | grep -qx true; then
                echo "::error::${PLATFORM}: container exited before becoming healthy"
                docker logs "${NAME}" || true
                exit 1
              fi
              sleep 2
            done
            if [ "${healthy}" != "1" ]; then
              echo "::error::${PLATFORM}: container never answered GET /api/health"
              docker logs "${NAME}" || true
              exit 1
            fi

            echo "GET /api/health (${PLATFORM}):"
            curl -fsS "http://127.0.0.1:${PORT}/api/health"
            echo

            # Guards the Dockerfile build args (VERSION injected from CI).
            IMAGE_VERSION="$(docker run --rm --platform "${PLATFORM}" \
              --entrypoint cat "${REF}" /app/version.txt | tr -d '[:space:]')"
            if [ "${IMAGE_VERSION}" != "${EXPECTED_VERSION}" ]; then
              echo "::error::${PLATFORM}: image embeds version '${IMAGE_VERSION}', expected '${EXPECTED_VERSION}'"
              exit 1
            fi
            echo "Embedded version OK: ${IMAGE_VERSION}"

            docker rm -f "${NAME}" >/dev/null 2>&1 || true
            echo "::endgroup::"
          done

          echo "All platforms healthy: $(printf '%s' "${PLATFORMS}" | tr ',' ' ')"
          echo "Manifest digest: ${DIGEST:-unknown}"

  # ---------------------------------------------------------------------------
  # Publish the TEST image (`:test` + `:sha-<short>`) on ghcr.io.
  #
  # Conditional on purpose: only on `push` to main and on `workflow_dispatch`,
  # NEVER on `pull_request` — (1) a `:test` pushed from a PR would overwrite the
  # tag with unmerged code; (2) package writes are not granted to fork PRs.
  #
  # `:sha-<short>` was already pushed by the `image` job; `:test` is promoted
  # here, AFTER the smoke test, from the exact digest that was validated.
  # Promotion is a registry-side manifest copy: no rebuild, no re-push of the
  # platform layers (cost: a few hundred milliseconds and a few hundred bytes).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ghcr :test
    needs: [quality, image]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the smoke-tested digest to :test
        id: promote
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA_SHORT: ${{ needs.image.outputs.sha_short }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE:-}" ] || [ -z "${SHA_SHORT:-}" ]; then
            echo "::error::missing image metadata from the 'image' job"
            exit 1
          fi
          if ! printf '%s' "${SHA_SHORT}" | grep -Eq '^[0-9a-f]+$'; then
            echo "::error::invalid short sha: '${SHA_SHORT}'"
            exit 1
          fi

          # Promote by DIGEST when the build reported one (identity is then
          # explicit, immune to a concurrent re-push of `:sha-<short>`), and
          # fall back to the immutable tag otherwise.
          if [ -n "${DIGEST:-}" ]; then
            SOURCE="${IMAGE}@${DIGEST}"
          else
            SOURCE="${IMAGE}:sha-${SHA_SHORT}"
          fi

          docker buildx imagetools create --tag "${IMAGE}:test" "${SOURCE}"
          echo "Promoted ${SOURCE} → ${IMAGE}:test"

      # The published tag must stay a multi-platform manifest list: this is
      # the exact regression that made the container loop with
      # `exec format error` on arm64 hosts.
      - name: Guard the published :test manifest (both platforms)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          PLATFORMS: ${{ needs.image.outputs.platforms }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s' "${PLATFORMS}" | tr ',' ' ')"
          # shellcheck disable=SC2086 # word splitting on the platform list is intended
          sh scripts/assert-image-platforms.sh "${IMAGE}:test" ${EXPECTED}

      - name: Summary
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SHA_SHORT: ${{ needs.image.outputs.sha_short }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PLATFORMS: ${{ needs.image.outputs.platforms }}
        run: |
          set -euo pipefail
          {
            echo "### Test image published on ${REGISTRY}"
            echo
            echo "| Tag | Reference |"
            echo "| --- | --- |"
            echo "| throwaway | \`${IMAGE}:test\` |"
            echo "| immutable | \`${IMAGE}:sha-${SHA_SHORT}\` |"
            echo
            echo "- Platforms: \`${PLATFORMS}\` (manifest list, smoke-tested per platform)."
            echo "- Manifest digest: \`${DIGEST:-n/a}\`"
            echo
            echo "> Release tags (\`:latest\`, \`:<version>\`) are NOT touched by this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
